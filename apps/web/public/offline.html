<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c12" />
  <title>מסמך לאודיו - אין חיבור</title>
  <style>
    :root { color-scheme: light dark; --bg:#edeef3; --fg:#14161f; --card:#fff; --muted:#6b6f80; --primary:#f2501f; --border:#d9dbe4; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0c0c12; --fg:#f0f1f6; --card:#16171f; --muted:#8e92a3; --border:#262833; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
           padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
    main { max-width: 620px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 8px 0 4px; }
    p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    li button { width: 100%; min-height: 56px; display:flex; align-items:center; gap:12px; text-align: start; padding: 10px 14px;
                background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 16px; font: inherit; font-weight: 600; touch-action: manipulation; }
    li button .dot { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color:#fff; display:grid; place-items:center; font-size: 16px; }
    li small { display:block; font-weight: 400; color: var(--muted); }
    .retry { margin-top: 18px; min-height: 48px; padding: 0 22px; border: 0; border-radius: 14px; background: var(--primary); color:#fff; font: inherit; font-weight: 700; touch-action: manipulation; }
    .player { position: sticky; bottom: 0; margin-top: 18px; padding: 12px; background: var(--card); border:1px solid var(--border); border-radius: 18px; }
    .player strong { display:block; margin-bottom: 8px; }
    audio { width: 100%; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>אין חיבור לאינטרנט</h1>
    <p id="hint">אפשר להאזין לקבצים שהורדתם למכשיר:</p>
    <ul id="list"></ul>
    <p id="empty" hidden>עוד לא הורדתם קבצים להאזנה בלי חיבור. הורידו מסמך כשיש חיבור, דרך תפריט הקובץ.</p>
    <div class="player" id="player" hidden>
      <strong id="now"></strong>
      <audio id="audio" controls preload="metadata"></audio>
    </div>
    <button class="retry" id="retry" type="button">נסו שוב</button>
  </main>
  <script>
    (function () {
      var CACHE = "audio-v1";
      var list = document.getElementById("list");
      var empty = document.getElementById("empty");
      var player = document.getElementById("player");
      var audio = document.getElementById("audio");
      var now = document.getElementById("now");

      function fmt(s) {
        s = Math.round(s || 0);
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
        var mm = (h ? String(m).padStart(2, "0") : String(m)), rr = String(r).padStart(2, "0");
        return (h ? h + ":" : "") + mm + ":" + rr;
      }

      document.getElementById("retry").onclick = function () { location.href = "/library"; };
      window.addEventListener("online", function () { location.href = "/library"; });

      if (!("caches" in window)) { empty.hidden = false; return; }
      caches.open(CACHE).then(function (cache) {
        return cache.keys().then(function (keys) {
          var metas = keys.filter(function (r) { return new URL(r.url).pathname.indexOf("/__meta/") === 0; });
          return Promise.all(metas.map(function (r) { return cache.match(r).then(function (res) { return res.json(); }); }));
        });
      }).then(function (items) {
        items = items.filter(Boolean);
        if (!items.length) { empty.hidden = false; return; }
        items.forEach(function (it) {
          var li = document.createElement("li");
          var b = document.createElement("button");
          b.type = "button";
          b.innerHTML = '<span class="dot">&#9654;</span><span><span dir="auto" class="t"></span><small></small></span>';
          b.querySelector(".t").textContent = it.name;
          b.querySelector("small").textContent = it.duration ? fmt(it.duration) : "";
          b.onclick = function () {
            audio.src = "/api/audio/" + it.id;
            now.textContent = it.name; now.setAttribute("dir", "auto");
            player.hidden = false;
            audio.play();
          };
          li.appendChild(b);
          list.appendChild(li);
        });
      });
    })();
  </script>
</body>
</html>
